# PR auto-labels by touched path (actions/labeler v5 syntax).
ios:
  - changed-files:
      - any-glob-to-any-file:
          - "ios/**"
          - "Package.swift"
          - "Aksara.podspec"
          - "scripts/**"

android:
  - changed-files:
      - any-glob-to-any-file:
          - "android/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
