version: 2
updates:
  # GitHub Actions used by the workflows above. Batched into a single PR per run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["ci", "dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # Gradle / Kotlin dependencies (coroutines, serialization, Kotlin & AGP plugins,
  # Gradle wrapper). Grouped so the Kotlin `jvm` + `serialization` plugins — which
  # must move together — land in one PR.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    labels: ["android", "dependencies"]
    groups:
      gradle:
        patterns: ["*"]

  # SwiftPM dependencies (root Package.swift). No external deps today, but this keeps
  # any future ones current.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    labels: ["ios", "dependencies"]
    groups:
      swift:
        patterns: ["*"]
